services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    env_file: .env
    environment:
      - DB_PATH=/app/data/berletek.db
      - NODE_ENV=production
    volumes:
      - db:/app/data
    networks:
      - berletek

volumes:
  db:

networks:
  berletek:
    driver: bridge
